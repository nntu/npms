info:
  title: NPMS API
  version: 1.0.0
openapi: 3.1.0
paths:
  /api/v1/cartridges:
    get:
      operationId: get-api-v1-cartridges
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartridgeListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Get API v1 cartridges
    post:
      operationId: post-api-v1-cartridges
      requestBody:
        content:
          application/json:
            schema:
