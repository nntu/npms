openapi: 3.1.0
info:
  title: NPMS API
  version: 0.1.0
  description: Local printer management API for the standalone SQLite deployment.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: API is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/health/live:
    get:
      operationId: getHealthLive
      responses:
        '200':
          description: Process liveness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/health/ready:
    get:
      operationId: getHealthReady
      responses:
        '200':
          description: API and database readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/snmp/profiles:
    get:
      operationId: listSNMPProfiles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profiles loaded from the external YAML profile directory.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/discovery/probe:
    post:
      operationId: probePrinterDiscovery
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryProbeRequest'
      responses:
        '200':
          description: Printer identity read from one explicitly supplied IP address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: The printer did not respond or SNMP probing failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/printers/register:
    post:
      operationId: registerPrinter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPrinter'
      responses:
        '201':
          description: Printer, encrypted credential and primary endpoint registered atomically.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Registration was rolled back because a record conflicted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/printers:
    post:
      operationId: createPrinter
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePrinter'
      responses:
        '201':
          description: Printer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Printer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      operationId: listPrinters
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Active printers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrinterPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/printers/{id}:
    get:
      operationId: getPrinter
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Printer details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Printer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Printer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/printers/{id}/counters:
    get:
      operationId: listPrinterCounters
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Immutable raw counter readings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CounterPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/printers/{id}/usage:
    get:
      operationId: listPrinterDailyUsage
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: timezone
          in: query
          description: IANA timezone used for local calendar-day allocation.
          schema: { type: string, default: UTC }
      responses:
        '200':
          description: Deterministic daily usage derived from raw counter readings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/printers/{id}/credentials:
    post:
      operationId: createPrinterCredential
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSNMPCredential'
      responses:
        '201':
          description: Encrypted credential reference created. Secret material is never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/printers/{id}/endpoints:
    post:
      operationId: createPrinterEndpoint
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEndpoint'
      responses:
        '201':
          description: SNMP endpoint created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Endpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/printers/{id}/polling-runs:
    get:
      operationId: listPrinterPollingRuns
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Polling diagnostics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PollingRunPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/printers/{id}/poll:
    post:
      operationId: pollPrinter
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Poll accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: A poll for this printer and job kind is already running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Polling is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/jobs/{id}:
    get:
      operationId: getJob
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current asynchronous job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/cartridges:
    get:
      operationId: listCartridges
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cartridge stock catalog.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartridgePage'
    post:
      operationId: createCartridge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCartridge'
      responses:
        '201':
          description: Cartridge type created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cartridge'
  /api/v1/cartridges/logs:
    get:
      operationId: listCartridgeLogs
      security:
        - bearerAuth: []
      parameters:
        - name: cartridge_id
          in: query
          schema: { type: string }
        - name: device_id
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Cartridge operation history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartridgeLogPage'
  /api/v1/cartridges/replace:
    post:
      operationId: replacePrinterCartridge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceCartridge'
      responses:
        '200':
          description: Cartridge replaced successfully; counter is captured from SNMP when available.
          content:
            application/json:
              schema:
                type: object
                required: [status, message, counter, counter_quality]
                properties:
                  status: { type: string, example: success }
                  message: { type: string }
                  counter: { type: integer, format: int64, description: Counter captured before the operation, or 0 when unavailable. }
                  counter_quality: { type: string, enum: [valid, unverified, unsupported, unavailable, suspicious] }
  /api/v1/cartridges/stock/refill-bottles:
    post:
      operationId: addRefillBottles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRefillBottles'
      responses:
        '200':
          description: Refill bottle stock updated.
  /api/v1/cartridges/refill-printer:
    post:
      operationId: refillPrinterCartridge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefillPrinterCartridge'
      responses:
        '200':
          description: Printer cartridge refilled; counter is captured from SNMP when available.
          content:
            application/json:
              schema:
                type: object
                required: [status, message, counter, counter_quality]
                properties:
                  status: { type: string, example: success }
                  message: { type: string }
                  counter: { type: integer, format: int64 }
                  counter_quality: { type: string, enum: [valid, unverified, unsupported, unavailable, suspicious] }
  /api/v1/cartridges/refill:
    post:
      operationId: refillCartridges
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefillCartridges'
      responses:
        '200':
          description: Cartridges refilled successfully.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Health:
      type: object
      required: [status, time]
      properties:
        status: { type: string, const: ok }
        time: { type: string, format: date-time }
    Printer:
      type: object
      required: [id, display_name, status]
      properties:
        id: { type: string }
        asset_code: { type: [string, 'null'] }
        display_name: { type: string }
        manufacturer: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        serial: { type: [string, 'null'] }
        department: { type: [string, 'null'] }
        status: { type: string, enum: [online, offline, unknown, unavailable] }
        last_seen_at: { type: [string, 'null'], format: date-time }
    CreatePrinter:
      type: object
      required: [display_name]
      additionalProperties: false
      properties:
        asset_code: { type: string, maxLength: 200 }
        display_name: { type: string, minLength: 1, maxLength: 200 }
        manufacturer: { type: string, maxLength: 200 }
        model: { type: string, maxLength: 200 }
        serial: { type: string, maxLength: 200 }
        sys_object_id: { type: string, maxLength: 200 }
        department: { type: string, maxLength: 200 }
    CreateSNMPCredential:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: string, enum: [2c, '3'] }
        community: { type: string, writeOnly: true }
        username: { type: string, writeOnly: true }
        auth_protocol: { type: string, enum: [MD5, SHA] }
        auth_passphrase: { type: string, writeOnly: true }
        priv_protocol: { type: string, enum: [DES, AES, AES128] }
        priv_passphrase: { type: string, writeOnly: true }
    CredentialCreated:
      type: object
      required: [id, version]
      properties:
        id: { type: string }
        version: { type: string, enum: [2c, '3'] }
    CreateEndpoint:
      type: object
      additionalProperties: false
      required: [address]
      properties:
        address: { type: string, minLength: 1, maxLength: 253 }
        protocol: { type: string, enum: [snmp], default: snmp }
        port: { type: integer, minimum: 1, maximum: 65535, default: 161 }
        credential_id: { type: string }
        is_primary: { type: boolean, default: false }
    Endpoint:
      type: object
      required: [id, device_id, address, protocol, port, is_primary]
      properties:
        id: { type: string }
        device_id: { type: string }
        address: { type: string }
        protocol: { type: string, const: snmp }
        port: { type: integer }
        credential_id: { type: [string, 'null'] }
        is_primary: { type: boolean }
    PrinterPage:
      type: object
      required: [data, limit, offset, total]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Printer' }
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
    Profile:
      type: object
      required: [id, version, manufacturer, verification_status, counter_keys]
      properties:
        id: { type: string }
        version: { type: integer, minimum: 1 }
        manufacturer: { type: string }
        verification_status: { type: string, enum: [verified, unverified, experimental] }
        counter_keys:
          type: array
          items: { type: string }
    ProfilePage:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Profile' }
        total: { type: integer, minimum: 0 }
    DiscoveryProbeRequest:
      type: object
      additionalProperties: false
      required: [address, version]
      properties:
        address: { type: string, format: ipv4 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 161 }
        version: { type: string, enum: [2c, '3'] }
        community: { type: string, writeOnly: true }
        username: { type: string, writeOnly: true }
        auth_protocol: { type: string, enum: [MD5, SHA] }
        auth_passphrase: { type: string, writeOnly: true }
        priv_protocol: { type: string, enum: [DES, AES, AES128] }
        priv_passphrase: { type: string, writeOnly: true }
        timeout: { type: integer, minimum: 1, maximum: 30, default: 3 }
    DiscoveryResult:
      type: object
      required: [address, name, description, sys_object_id, serial]
      properties:
        address: { type: string, format: ipv4 }
        name: { type: string }
        description: { type: string }
        sys_object_id: { type: string }
        serial: { type: string }
    RegisterPrinter:
      type: object
      additionalProperties: false
      required: [display_name, address, version]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        asset_code: { type: string, maxLength: 200 }
        manufacturer: { type: string, maxLength: 200 }
        model: { type: string, maxLength: 200 }
        serial: { type: string, maxLength: 200 }
        sys_object_id: { type: string, maxLength: 200 }
        department: { type: string, maxLength: 200 }
        profile_id: { type: string, description: Optional explicit profile override; otherwise resolved from printer identity. }
        address: { type: string, minLength: 1, maxLength: 253 }
        port: { type: integer, minimum: 1, maximum: 65535, default: 161 }
        version: { type: string, enum: [2c, '3'] }
        community: { type: string, writeOnly: true }
        username: { type: string, writeOnly: true }
        auth_protocol: { type: string, enum: [MD5, SHA] }
        auth_passphrase: { type: string, writeOnly: true }
        priv_protocol: { type: string, enum: [DES, AES, AES128] }
        priv_passphrase: { type: string, writeOnly: true }
    RegistrationResult:
      type: object
      required: [printer, credential_id, endpoint_id, poll_status]
      properties:
        printer: { $ref: '#/components/schemas/Printer' }
        credential_id: { type: string }
        endpoint_id: { type: string }
        poll_job_id: { type: [string, 'null'] }
        poll_status: { type: string, enum: [queued, not_started] }
        profile_id: { type: [string, 'null'] }
        counter_definition_count: { type: integer, minimum: 0 }
    Counter:
      type: object
      required: [id, definition_key, unit, scope, raw_value, collected_at, quality]
      properties:
        id: { type: integer }
        definition_key: { type: string }
        unit: { type: string, enum: [impressions, sheets] }
        scope: { type: string }
        raw_value: { type: integer, format: int64, minimum: 0 }
        collected_at: { type: string, format: date-time }
        quality: { type: string, enum: [valid, unverified, unsupported, unavailable, suspicious] }
    CounterPage:
      type: object
      required: [data, limit, offset, total]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Counter' }
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
    DailyUsage:
      type: object
      required: [definition_key, unit, scope, local_date, delta, quality]
      properties:
        definition_key: { type: string }
        unit: { type: string, enum: [impressions, sheets] }
        scope: { type: string }
        local_date: { type: string, format: date }
        delta: { type: integer, format: int64, minimum: 0 }
        quality: { type: string, enum: [valid, unverified] }
    UsagePage:
      type: object
      required: [data, total, timezone]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/DailyUsage' }
        total: { type: integer, minimum: 0 }
        timezone: { type: string }
    PollingRun:
      type: object
      required: [id, job_kind, started_at, result, attempt_count]
      properties:
        id: { type: string }
        job_kind: { type: string }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        result: { type: string, enum: [running, success, failed] }
        error_code: { type: [string, 'null'] }
        profile_version: { type: integer }
        attempt_count: { type: integer, minimum: 1 }
    PollingRunPage:
      type: object
      required: [data, limit, offset, total]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/PollingRun' }
        limit: { type: integer }
        offset: { type: integer }
        total: { type: integer }
    JobAccepted:
      type: object
      required: [job_id, status, status_url]
      properties:
        job_id: { type: string }
        status: { type: string, const: queued }
        status_url: { type: string }
    Job:
      type: object
      required: [id, device_id, status]
      properties:
        id: { type: string }
        device_id: { type: string }
        status: { type: string, enum: [queued, success, failed] }
        error_code: { type: [string, 'null'] }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    Cartridge:
      type: object
      required: [id, sku_code, name, stock_new, stock_refilled, stock_empty]
      properties:
        id: { type: string }
        sku_code: { type: string }
        name: { type: string }
        compatible_models: { type: [string, 'null'] }
        stock_new: { type: integer, minimum: 0 }
        stock_refilled: { type: integer, minimum: 0 }
        stock_empty: { type: integer, minimum: 0 }
        stock_refill_bottles: { type: integer, minimum: 0 }
    CreateCartridge:
      type: object
      required: [sku_code, name]
      properties:
        sku_code: { type: string }
        name: { type: string }
        compatible_models: { type: string }
        stock_new: { type: integer, default: 0 }
        stock_refilled: { type: integer, default: 0 }
        stock_empty: { type: integer, default: 0 }
        stock_refill_bottles: { type: integer, default: 0 }
    AddRefillBottles:
      type: object
      required: [cartridge_id, quantity]
      properties:
        cartridge_id: { type: string }
        quantity: { type: integer, minimum: 1 }
        notes: { type: string }
    ReplaceCartridge:
      type: object
      required: [cartridge_id, device_id, source_type]
      properties:
        cartridge_id: { type: string }
        device_id: { type: string }
        source_type: { type: string, enum: [new, refilled] }
        page_count: { type: integer, minimum: 1, description: Optional manual counter when live SNMP capture is unavailable. Stored as unverified. }
        notes: { type: string }
    RefillCartridges:
      type: object
      required: [cartridge_id, quantity]
      properties:
        cartridge_id: { type: string }
        quantity: { type: integer, minimum: 1 }
        notes: { type: string }
    RefillPrinterCartridge:
      type: object
      required: [cartridge_id, device_id, quantity]
      properties:
        cartridge_id: { type: string }
        device_id: { type: string }
        quantity: { type: integer, minimum: 1 }
        page_count: { type: integer, minimum: 1, description: Optional manual counter when live SNMP capture is unavailable. }
        notes: { type: string }
    CartridgePage:
      type: object
      required: [data, total]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Cartridge' }
        total: { type: integer }
    CartridgeLog:
      type: object
      required: [id, cartridge_id, action_type, quantity, performed_at]
      properties:
        id: { type: string }
        cartridge_id: { type: string }
