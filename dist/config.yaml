database:
  path: ./data/npms.db

server:
  listen: 127.0.0.1:8080
  allowed_origin: http://localhost:8080
  # Leave empty for localhost-only single-machine mode.
  api_token: ""

security:
  # 32-byte base64 or 64-character hex key. Use a file permission-protected config.
  encryption_key: replace-with-a-32-byte-base64-or-64-character-hex-key

polling:
  concurrency: 5
  status_interval: 5m
  counter_interval: 15m

report:
  # IANA timezone used when materializing daily and monthly printer usage.
  timezone: Asia/Ho_Chi_Minh

retention:
  # Poll history without raw readings, events and completed jobs are removed after these periods.
  polling_runs_days: 30
  counter_events_days: 90
  jobs_days: 30
  cleanup_interval: 24h

logging:
  # Error-level JSON logs; a new file is created each day and when the size limit is reached.
  error_file: ./data/npms-errors.log
  daily: true
  max_size_mb: 10

profiles:
  # External directory; profiles are not embedded in the executable.
  path: ./profiles
